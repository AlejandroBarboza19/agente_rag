<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente de Cobertura Médica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Asistente Inteligente de Cobertura Médica</h3>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <label class="form-label">ID Afiliado</label>
                <input type="text" id="affiliate_id" class="form-control" placeholder="A-00001">
            </div>

            <div class="mb-3">
                <label class="form-label">Consulta</label>
                <textarea id="query" class="form-control" rows="3"
                          placeholder="Ej: ¿La resonancia está cubierta?"></textarea>
            </div>

            <button class="btn btn-primary w-100" onclick="sendQuery()">
                Consultar
            </button>

        </div>
    </div>

    <div class="card mt-4 shadow">
        <div class="card-header">
            Resultado
        </div>

        <div class="card-body">

            <h5>Estado:</h5>
            <p id="estado" class="fw-bold"></p>

            <h5>Explicación:</h5>
            <p id="explicacion"></p>

            <h5>Fuentes:</h5>
            <ul id="fuentes"></ul>

        </div>
    </div>

</div>

<script src="/static/js/script.js"></script>
</body>
</html>
